name: Regenerar listas

# Se lanza desde el botón del panel de administrador (vía Edge Function de Supabase)
# o a mano desde la pestaña Actions de GitHub.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-lists
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar JSON desde Supabase
        run: node scripts/export-players.mjs
        env:
          SUPABASE_URL: https://egutaqmgcpiqiicrgmfe.supabase.co
          SUPABASE_KEY: sb_publishable_-4qlTZ9LeFXzRxJ0T0_Fkw_8vZANs1L

      - name: Subir los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Regenerar listas de jugadores"
            git push
          fi
