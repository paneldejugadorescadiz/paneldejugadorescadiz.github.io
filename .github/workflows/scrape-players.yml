name: Bot de extracción

# Se lanza a mano desde la pestaña Actions. Procesa las fichas pendientes de la cola
# (tabla scrape_queue de Supabase). El resultado de cada ficha queda en esa tabla.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cuántas fichas procesar (máximo 50)'
        required: true
        default: '10'

permissions:
  contents: read

concurrency:
  group: scrape-players
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Procesar la cola
        run: node scripts/scrape-players.mjs
        env:
          SUPABASE_URL: https://egutaqmgcpiqiicrgmfe.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT: ${{ inputs.limit }}
