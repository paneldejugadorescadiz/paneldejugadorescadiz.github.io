<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administrador · Panel de jugadores Cádiz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero compact">
    <div class="wrap">
      <h1>Administrador</h1>
      <p class="lede"><a href="index.html">Volver al panel de jugadores</a></p>
    </div>
  </header>

  <main class="wrap">
    <!-- Inicio de sesión -->
    <section id="view-login" class="panel" hidden>
      <h2>Iniciar sesión</h2>
      <form id="login-form">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" class="input" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" class="input" type="password" autocomplete="current-password" required>
        </div>
        <div class="actions"><button class="btn" type="submit">Entrar</button></div>
        <p id="login-status" class="status" role="status"></p>
      </form>
    </section>

    <!-- Sesión iniciada pero sin permisos de administrador -->
    <section id="view-denied" class="panel" hidden>
      <h2>Esta cuenta no es de administrador</h2>
      <p class="meta">Cierra la sesión y entra con una cuenta de administrador.</p>
      <div class="actions"><button id="logout-denied" class="btn secondary" type="button">Cerrar sesión</button></div>
    </section>

    <!-- Panel de administrador -->
    <section id="view-panel" class="panel" hidden>
      <h2>Listas de jugadores</h2>
      <p class="meta">Sesión de <span id="who"></span></p>
      <p id="meta-info" class="meta">Cargando estado de las listas…</p>
      <div class="actions">
        <button id="regenerate" class="btn" type="button">Regenerar listas</button>
        <button id="logout" class="btn secondary" type="button">Cerrar sesión</button>
      </div>
      <p id="panel-status" class="status" role="status"></p>
    </section>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
