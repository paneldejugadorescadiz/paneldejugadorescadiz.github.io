<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de jugadores Cádiz</title>
  <meta name="description" content="Jugadores de Cádiz de 2003 a 2007 con datos públicos de La Preferente.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#resultados">Saltar a los resultados</a>

  <header class="hero">
    <div class="wrap">
      <h1>Jugadores de Cádiz</h1>
      <p class="lede">De 2003 a 2007, con datos públicos de La Preferente.</p>

      <form id="search-form" class="search" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="q" type="search" placeholder="Busca por nombre"
               autocomplete="off" aria-label="Buscar por nombre">
      </form>
    </div>
  </header>

  <main class="wrap">
    <section id="controls" class="controls" aria-label="Filtros">
      <div id="years" class="years" role="group" aria-label="Año de nacimiento"></div>
      <div class="club-field">
        <label for="club">Club</label>
        <select id="club"><option value="">Todos los clubes</option></select>
      </div>
    </section>

    <section id="resultados" aria-label="Resultados">
      <p id="count" class="count" aria-live="polite">Cargando…</p>
      <ul id="rows" class="players"></ul>

      <div id="empty" class="empty" hidden>
        <p id="empty-text"></p>
        <button id="reset" class="btn secondary" type="button">Quitar filtros</button>
      </div>

      <div class="more"><button id="more" class="btn" type="button" hidden>Mostrar más</button></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Fuente de los datos: <a href="https://www.lapreferente.com/" rel="noopener noreferrer">lapreferente.com</a>. <span id="updated"></span></p>
      <p><a href="admin.html">Acceso administrador</a></p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
